name: Automatically create / update pull request

on:
  push:
    branches:
      - "feat-openapi-update"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  create_pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_APP_KEY: ${{ secrets.BLUES_HUB_AUTOMATION_PRIVATE_KEY != '' }}
    steps:
      - name: Generate app token
        id: app-token
        if: vars.BLUES_HUB_AUTOMATION_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLUES_HUB_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.BLUES_HUB_AUTOMATION_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          USING_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --base main --json number,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .number')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing for $BRANCH already exists."
            exit 0
          fi
          changed=$(gh api "repos/$GH_REPO/compare/main...$BRANCH" --jq '.files | length')
          if [ "$changed" -eq 0 ]; then
            echo "No changes between main and $BRANCH."
            exit 0
          fi
          if [ "$USING_APP_TOKEN" != "true" ]; then
            echo "::warning::No app token (BLUES_HUB_AUTOMATION_CLIENT_ID variable or BLUES_HUB_AUTOMATION_PRIVATE_KEY secret is missing or invalid); opening the PR with GITHUB_TOKEN, so its CI run will wait for approval."
          fi
          gh api "repos/$GH_REPO/contents/.github/PULL_REQUEST_TEMPLATE.md?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw+json" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" --draft \
            --title "feat: update SDK from Notehub OpenAPI spec ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --reviewer Bucknalla
