name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGEN_COMMIT_MESSAGE: "chore: regenerate SDK from OpenAPI spec"

jobs:
  verify-sdk:
    name: Verify SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      needs-push: ${{ steps.check.outputs.needs-push }}
    env:
      CAN_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CAN_PUSH == 'true' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install code generation tools
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          npm install -g --ignore-scripts @openapitools/openapi-generator-cli@2.41.0 prettier@3.9.10
          go install golang.org/x/tools/cmd/goimports@v0.52.0

      - name: Regenerate SDK
        run: ./scripts.sh generate_and_format

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Check whether the SDK is up to date
        id: check
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "SDK is up to date."
            exit 0
          fi
          git diff --cached --stat
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::The SDK is out of date with openapi.yaml. Run ./scripts.sh generate_and_format and commit the result."
            exit 1
          fi
          if [ "$(git log -1 --format=%s)" = "$REGEN_COMMIT_MESSAGE" ]; then
            echo "::error::Regenerating on top of a regeneration commit still changed files, so generation isn't deterministic. Not pushing again."
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/regenerated-sdk.patch"
          echo "needs-push=true" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated SDK patch
        if: steps.check.outputs.needs-push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-sdk-patch
          path: ${{ runner.temp }}/regenerated-sdk.patch
          retention-days: 1
          overwrite: true

  push-regenerated-sdk:
    name: Push regenerated SDK
    needs: verify-sdk
    if: needs.verify-sdk.outputs.needs-push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      HAS_APP_KEY: ${{ secrets.BLUES_HUB_AUTOMATION_PRIVATE_KEY != '' }}

    steps:
      - name: Generate app token
        id: app-token
        if: vars.BLUES_HUB_AUTOMATION_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLUES_HUB_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.BLUES_HUB_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download regenerated SDK patch
        uses: actions/download-artifact@v8
        with:
          name: regenerated-sdk-patch
          path: ${{ runner.temp }}

      - name: Commit and push regenerated SDK
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::No app token (BLUES_HUB_AUTOMATION_CLIENT_ID variable or BLUES_HUB_AUTOMATION_PRIVATE_KEY secret is missing or invalid); pushing with GITHUB_TOKEN, so CI on the new commit will wait for approval."
          fi
          git apply --index "$RUNNER_TEMP/regenerated-sdk.patch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "$REGEN_COMMIT_MESSAGE"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
